<script type="module">
// طبقة ربط: بتخلي التطبيق يشتغل على Firebase (Auth + Firestore) بدل مزامنة Claude.
// لو firebase-config.js لسه فيه YOUR_API_KEY يشتغل التطبيق محليًا بدون سحابة.
const cfg = window.FIREBASE_CONFIG || {}, WS = window.WORKSPACE_ID || 'main';
const ok = cfg.apiKey && !/^YOUR_/.test(cfg.apiKey);
const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
let F, ctx;
function box(h) {
  let o = document.getElementById('fbov');
  if (!o) { o = document.createElement('div'); o.id = 'fbov';
    o.style.cssText = 'position:fixed;inset:0;z-index:999;background:#0a1426;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:700 16px Cairo,Tahoma,sans-serif;padding:24px;text-align:center';
    document.body.appendChild(o); }
  o.innerHTML = h; return o;
}
const BTN = 'style="background:#0fb67f;color:#fff;border:0;border-radius:14px;padding:13px 26px;font:700 15px Cairo,Tahoma,sans-serif;cursor:pointer"';
async function setup() {
  const [a, au, fs] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')]);
  const app = a.initializeApp(cfg), auth = au.getAuth(app), db = fs.getFirestore(app);
  F = { au, fs, auth, db };
  const user = await new Promise(res => {
    let done = 0;
    au.onAuthStateChanged(auth, u => {
      if (u) { if (!done) { done = 1; res(u); } }
      else {
        box('<div style="font-size:30px">أقساطي</div><div>سجّل الدخول للمتابعة</div><button id="fbb" ' + BTN + '>دخول بحساب Google</button>');
        document.getElementById('fbb').onclick = () => au.signInWithPopup(auth, new au.GoogleAuthProvider()).catch(e => alert(e.message));
      }
    });
  });
  await fs.setDoc(fs.doc(db, 'users', user.uid), { name: user.displayName || user.email || 'مستخدم', email: user.email || '' });
  const wr = fs.doc(db, 'workspaces', WS);
  let s = await fs.getDoc(wr);
  if (!s.exists()) { await fs.setDoc(wr, { ownerUid: user.uid, members: {} }); s = await fs.getDoc(wr); }
  const w = s.data(), lvl = w.ownerUid === user.uid ? 4 : ((w.members || {})[user.uid] || 0);
  if (!lvl) {
    box('<div>تم تسجيلك باسم ' + (user.email || user.displayName) + '</div><div>اطلب من مالك الحساب إضافتك من صفحة "فريق العمل"، ثم أعد تحميل الصفحة.</div><button id="fbo" ' + BTN + '>تسجيل خروج</button>');
    document.getElementById('fbo').onclick = () => au.signOut(auth).then(() => location.reload());
  } else document.getElementById('fbov')?.remove();
  return { user, wr, lvl };
}
async function syncMembers(d) {
  try {
    const m = {}, sn = []; JSON.parse(d.v).forEach(x => { if (x.id) { m[x.id] = x.r === 'مشاهد' ? 1 : x.r === 'مدير' ? 3 : 2; if ((x.p || []).indexOf('s') > -1) sn.push(x.id); } });
    await F.fs.setDoc(ctx.wr, { members: m, sens: sn }, { merge: true });
  } catch (e) { console.warn('members sync', e); }
}
const dbApi = {
  collection: p => ({
    doc: id => {
      const r = F.fs.doc(F.db, 'workspaces', WS, p, id);
      return {
        get: async () => { const s = await F.fs.getDoc(r); return { id, exists: s.exists(), data: () => s.data() }; },
        set: async d => { await F.fs.setDoc(r, d); if (p === 'st' && id === 'tm') await syncMembers(d); }
      };
    },
    onSnapshot: (cb, err) => F.fs.onSnapshot(F.fs.collection(F.db, 'workspaces', WS, p),
      s => cb({ docs: s.docs.map(x => ({ id: x.id, exists: true, data: () => x.data() })) }), err)
  })
};
const userApi = () => ({
  id: async () => ctx.user.uid,
  name: ctx.user.displayName || ctx.user.email || '',
  signOut: () => F.au.signOut(F.auth),
  isOwner: () => ctx.lvl === 4,
  canEdit: () => ctx.lvl >= 3,
  can: n => n === 'data.write' ? ctx.lvl >= 2 : true,
  search: async q => {
    const s = await F.fs.getDocs(F.fs.collection(F.db, 'users')); q = (q || '').toLowerCase();
    return s.docs.map(d => ({ id: d.id, name: d.data().name || d.data().email, email: d.data().email || '' }))
      .filter(u => !q || (u.name + ' ' + u.email).toLowerCase().includes(q));
  }
});
const dlApi = { save: async ({ filename, data }) => {
  const b = data instanceof Blob ? data : new Blob([data]), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = filename; a.click(); return { saved: true };
} };
window.__res(async name => {
  if (name === 'downloads') return dlApi;
  if (!ok) { console.info('Firebase غير مفعّل: عدّل firebase-config.js'); return null; }
  ctx = ctx || await setup();
  if (!ctx.lvl) return new Promise(() => {});
  return name === 'db' ? dbApi : name === 'user' ? userApi() : null;
});
</script>
