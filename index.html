<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أقساطي</title>
<link rel="manifest" href="manifest.webmanifest">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f6fb;--card:#fff;--in:#eef2f8;--b:#dbe3ef;--tx:#13213a;--mu:#64748b;--g:#0fb67f;--g2:#07946a;--wn:#8a5b00;--wnb:#fff4d6;--rd:#d63a52;--ind:#5b4ff0;--hero:linear-gradient(135deg,#d8f5ea,#eaf1fb)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1426;--card:#101c33;--in:#16243f;--b:#1f2f4d;--tx:#e7edf7;--mu:#8b9bb8;--wn:#f5b84b;--wnb:#2a2414;--rd:#f0556a;--hero:linear-gradient(135deg,#0f3a35,#101c33)}}
:root[data-theme="dark"]{--bg:#0a1426;--card:#101c33;--in:#16243f;--b:#1f2f4d;--tx:#e7edf7;--mu:#8b9bb8;--wn:#f5b84b;--wnb:#2a2414;--rd:#f0556a;--hero:linear-gradient(135deg,#0f3a35,#101c33)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;font-size:15px;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;gap:8px;padding:10px 14px;align-items:center}
.ib{width:42px;height:42px;border-radius:13px;border:1px solid var(--b);background:var(--card);color:var(--tx);font-size:18px;cursor:pointer;font-family:inherit}
.sp{flex:1}
main{padding:0 14px 20px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--b);border-radius:20px;padding:16px;margin:12px 0}
.hero{background:var(--hero)}
.hd{display:flex;gap:12px;align-items:center}.hd small{color:var(--g);font-weight:700}
h1{font-size:24px;margin:2px 0}h2{font-size:18px;margin:0 0 4px}
.mu{color:var(--mu);font-size:13px;line-height:1.7;margin:6px 0}
.ic{width:44px;height:44px;border-radius:13px;background:var(--in);display:grid;place-items:center;color:var(--g);font-size:20px;flex:none}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;background:var(--g);color:#fff;font:700 15px Cairo,sans-serif;cursor:pointer;margin:8px 0;text-align:center}
.btn.s{background:var(--in);color:var(--tx);border:1px solid var(--b)}.btn.d{background:transparent;color:var(--rd);border:1px solid var(--rd)}
.btn.sm{display:inline-block;width:auto;padding:7px 14px;font-size:13px;margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--b);border-radius:18px;padding:14px}.stat b{display:block;font-size:22px;margin:4px 0}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--in);color:var(--tx);border:1px solid var(--b);border-radius:13px;padding:12px;font:600 15px Cairo,sans-serif}
.seg{display:flex;background:var(--in);border-radius:14px;padding:4px;gap:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:10px 14px;border-radius:11px;font:700 14px Cairo,sans-serif;white-space:nowrap;cursor:pointer}
.seg button.on{background:var(--ind);color:#fff}.tabs button.on{background:var(--g)}
.note{border-radius:14px;padding:12px;font-size:13px;line-height:1.7;margin:10px 0;border:1px solid var(--b)}
.note.w{background:var(--wnb);color:var(--wn)}.note.i{background:var(--in)}
.empty{border:2px dashed var(--b);border-radius:20px;padding:34px 16px;text-align:center;color:var(--mu);margin:12px 0}.empty b{display:block;color:var(--tx);font-size:17px;margin:8px 0}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--b)}.li:last-child{border:0}
.tag{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--in);color:var(--mu);font-weight:700}.tag.g{background:#0fb67f22;color:var(--g)}.tag.r{background:#d63a5222;color:var(--rd)}
.bar{position:fixed;inset:auto 0 0;z-index:20;background:var(--card);border-top:1px solid var(--b);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:space-between}
.bar .btn{width:auto;margin:0;padding:12px 26px}
.sum div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--b);font-weight:600}.sum div:last-child{border:0}.sum span:first-child{color:var(--mu)}
.drawer{position:fixed;inset:0;z-index:40;display:none}.drawer.on{display:block}
.drawer .bg{position:absolute;inset:0;background:#0008}
.drawer nav{position:absolute;top:0;bottom:0;right:0;width:82%;max-width:320px;background:var(--card);padding:calc(14px + env(safe-area-inset-top,0px)) 12px 14px;overflow-y:auto;border-left:1px solid var(--b)}
.logo{text-align:center;font-weight:800;font-size:28px;color:var(--g);margin-bottom:10px}.logo small{display:block;font-size:11px;color:var(--mu)}
.g1{width:100%;display:flex;justify-content:space-between;background:none;border:0;color:var(--tx);font:700 15px Cairo,sans-serif;padding:11px 8px;cursor:pointer;border-radius:12px}
.g1.on{background:var(--in);color:var(--g)}
.sub{display:none;padding:0 14px 6px}.sub.on{display:block}
.sub a{display:block;padding:9px 12px;color:var(--mu);text-decoration:none;font-weight:600;border-radius:10px;font-size:14px}.sub a.on{color:var(--g);background:var(--in)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;z-index:50;font-size:14px}
.ups .card{border-top:3px solid var(--g)}.ups li{list-style:none;background:var(--in);padding:11px;border-radius:12px;margin:8px 0;font-size:13px;line-height:1.7}
.ups ul{padding:0}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
/* PWA + sync + boot */
.sync-badge{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:25;background:var(--wnb);color:var(--wn);padding:6px 14px;border-radius:99px;font:700 12px Cairo,sans-serif;border:1px solid var(--b);box-shadow:0 4px 14px #0002;display:none;white-space:nowrap}
.sync-badge.on{display:block}
.sync-badge.off{background:#d63a5222;color:var(--rd)}
#bootl{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .25s}
#bootl .lg{font-size:44px;font-weight:800;color:var(--g);letter-spacing:-1px}
#bootl .sp{width:40px;height:40px;border:3px solid var(--b);border-top-color:var(--g);border-radius:50%;animation:aqspin .8s linear infinite}
#bootl .ms{color:var(--mu);font-size:13px}
@keyframes aqspin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="top">
<button class="ib" id="mn" aria-label="القائمة">☰</button><span class="sp"></span>
<button class="ib" id="th" aria-label="الوضع">◐</button>
<button class="ib" id="nt" aria-label="الإشعارات">🔔</button>
</div>
<main id="app"></main>
<div id="bootl">
  <div class="lg">Aqsaty</div>
  <div class="sp"></div>
  <div class="ms" id="bootmsg">جاري التحميل…</div>
</div>
<div id="syncb" class="sync-badge"></div>
<div class="drawer" id="dr"><div class="bg"></div><nav id="nv"></nav></div>

window.FIREBASE_CONFIG = {

window.WORKSPACE_ID = "main";

<script>window.__claudeReady=new Promise(function(r){window.__res=r});window.claude={use:function(n){return window.__claudeReady.then(function(f){return f(n)})}}</script>
<script type="module">
const cfg = window.FIREBASE_CONFIG || {}, WS = window.WORKSPACE_ID || 'main';
const ok = cfg.apiKey && !/^YOUR_/.test(cfg.apiKey);
const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
let F, ctx;
function box(h){let o=document.getElementById('fbov');if(!o){o=document.createElement('div');o.id='fbov';o.style.cssText='position:fixed;inset:0;z-index:999;background:#0a1426;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:700 16px Cairo,Tahoma,sans-serif;padding:24px;text-align:center';document.body.appendChild(o);}o.innerHTML=h;return o;}
const BTN='style="background:#0fb67f;color:#fff;border:0;border-radius:14px;padding:13px 26px;font:700 15px Cairo,Tahoma,sans-serif;cursor:pointer"';
function isMobileOrStandalone(){const ua=navigator.userAgent;return /iPhone|iPad|iPod/i.test(ua)||/FBAN|FBAV|Instagram|Line\//i.test(ua)||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}
function authErrorMsg(e){const M={'auth/popup-blocked':'المتصفح منع النافذة. جرّب مرة تانية.','auth/popup-closed-by-user':'اتقفلت النافذة قبل إكمال الدخول.','auth/operation-not-allowed':'مزوّد Google غير مفعّل. تواصل مع مالك النظام.','auth/unauthorized-domain':'النطاق الحالي غير مصرّح به في Firebase Console.','auth/account-exists-with-different-credential':'البريد مسجّل بطريقة دخول أخرى.','auth/network-request-failed':'تحقق من اتصالك بالإنترنت.','auth/too-many-requests':'محاولات كثيرة. انتظر قليلًا.'};return M[e.code]||(e.message||'تعذر تسجيل الدخول. جرّب تاني.');}
let loginShown=false;
function showLogin(){
  if(loginShown)return;loginShown=true;
  box('<div style="font-size:30px">أقساطي</div><div>سجّل الدخول للمتابعة</div><button id="fbb" '+BTN+'>دخول بحساب Google</button><div id="fbe" style="color:#f0556a;font-size:13px;min-height:1.4em;max-width:300px"></div>');
  const btn=document.getElementById('fbb'),err=document.getElementById('fbe');
  btn.onclick=async()=>{
    btn.disabled=true;btn.textContent='جاري…';err.textContent='';
    const provider=new F.au.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    try{
      if(isMobileOrStandalone()){await F.au.signInWithRedirect(F.auth,provider);return;}
      await F.au.signInWithPopup(F.auth,provider);
    }catch(e){
      btn.disabled=false;btn.textContent='دخول بحساب Google';
      if(e.code==='auth/popup-blocked'||e.code==='auth/popup-closed-by-user'){
        try{await F.au.signInWithRedirect(F.auth,new F.au.GoogleAuthProvider());return;}catch(e2){}
      }
      err.textContent=authErrorMsg(e);
    }
  };
}
async function waitForAccess(user,wr){
  const first=await F.fs.getDoc(wr),d0=first.data()||{};
  const lvl0=d0.ownerUid===user.uid?4:((d0.members||{})[user.uid]||0);
  if(lvl0){document.getElementById('fbov')?.remove();return lvl0;}
  return await new Promise(resolve=>{
    box('<div style="font-size:24px">⏳</div><div>تم تسجيلك باسم<br><b>'+(user.email||user.displayName||'')+'</b></div><div style="max-width:340px;line-height:1.7;font-size:14px;opacity:.85">اطلب من مالك الحساب إضافتك من صفحة «فريق العمل».<br>هذه الشاشة هتتحدّث تلقائيًا بمجرد إضافتك.</div><button id="fbo" '+BTN+' style="background:#16243f">تسجيل خروج</button>');
    document.getElementById('fbo').onclick=()=>F.au.signOut(F.auth).then(()=>location.reload());
    const unsub=F.fs.onSnapshot(wr,snap=>{if(!snap.exists())return;const d=snap.data();const l=d.ownerUid===user.uid?4:((d.members||{})[user.uid]||0);if(l){unsub();document.getElementById('fbov')?.remove();resolve(l);}},err=>console.warn('access watch',err));
  });
}
async function setup(){
  const [a,au,fs,stg]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js'),import(B+'firebase-storage.js')]);
  const app=a.initializeApp(cfg);
  const auth=au.getAuth(app);
  let db;
  try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})});}
  catch(e){console.warn('Firestore persistence غير متاح',e);db=fs.getFirestore(app);}
  const storage=stg.getStorage(app);
  F={au,fs,auth,db,stg,storage};
  window.__fb=F;
  try{await au.getRedirectResult(auth);}catch(e){console.warn('redirect result',e);}
  try{await au.setPersistence(auth,au.browserLocalPersistence);}catch(e){}
  const user=await new Promise(res=>{let done=0;au.onAuthStateChanged(auth,u=>{if(u&&!done){done=1;res(u);}else if(!u){showLogin();}});});
  fs.setDoc(fs.doc(db,'users',user.uid),{name:user.displayName||user.email||'مستخدم',email:user.email||''}).catch(e=>console.warn('user doc write',e));
  const wr=fs.doc(db,'workspaces',WS);
  let s=await fs.getDoc(wr);
  if(!s.exists()){try{await fs.setDoc(wr,{ownerUid:user.uid,members:{}});}catch(e){}s=await fs.getDoc(wr);}
  const lvl=await waitForAccess(user,wr);
  au.onAuthStateChanged(auth,u=>{if(!u&&ctx)location.reload();});
  return {user,wr,lvl};
}
async function syncMembers(d){
  try{
    const m={},sn=[];
    JSON.parse(d.v).forEach(x=>{if(x.id){m[x.id]=x.r==='مشاهد'?1:x.r==='مدير'?3:2;if((x.p||[]).indexOf('s')>-1)sn.push(x.id);}});
    await F.fs.setDoc(ctx.wr,{members:m,sens:sn},{merge:true});
  }catch(e){console.warn('members sync',e);}
}
const dbApi={collection:p=>({
  doc:id=>{
    const r=F.fs.doc(F.db,'workspaces',WS,p,id);
    return {
      get:async()=>{const s=await F.fs.getDoc(r);return {id,exists:s.exists(),data:()=>s.data()};},
      set:async d=>{await F.fs.setDoc(r,d);if(p==='st'&&id==='tm')await syncMembers(d);}
    };
  },
  onSnapshot:(cb,err)=>F.fs.onSnapshot(F.fs.collection(F.db,'workspaces',WS,p),s=>cb({docs:s.docs.map(x=>({id:x.id,exists:true,data:()=>x.data()}))}),err)
})};
const userApi=()=>({
  id:async()=>ctx.user.uid,
  name:ctx.user.displayName||ctx.user.email||'',
  signOut:()=>F.au.signOut(F.auth),
  isOwner:()=>ctx.lvl===4,
  canEdit:()=>ctx.lvl>=3,
  can:n=>n==='data.write'?ctx.lvl>=2:true,
  search:async q=>{const s=await F.fs.getDocs(F.fs.collection(F.db,'users'));q=(q||'').toLowerCase();return s.docs.map(d=>({id:d.id,name:d.data().name||d.data().email,email:d.data().email||''})).filter(u=>!q||(u.name+' '+u.email).toLowerCase().includes(q));}
});
const dlApi={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;a.click();return {saved:true};}};
window.__res(async name=>{
  if(name==='downloads')return dlApi;
  if(!ok){console.info('Firebase غير مفعّل');return null;}
  ctx=ctx||await setup();
  if(!ctx.lvl)return new Promise(()=>{});
  return name==='db'?dbApi:name==='user'?userApi():null;
});
</script>
